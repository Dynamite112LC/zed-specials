# Rebuilds the specials feed every morning and publishes it with GitHub Pages.
# The app downloads https://<account>.github.io/<repo>/feed.json on its own.
# Every price read is also added to the price history on the "data" branch,
# next to the list of leaflets each shop had when it was last reached.
name: Update specials feed

on:
  schedule:
    # 04:00 UTC is 06:00 in Zambia. GitHub may start scheduled runs late.
    - cron: '0 4 * * *'
    # A second go at midday: a shop's site sometimes refuses the server
    # the morning run happened to get.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: specials-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To commit the price history to the "data" branch.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The price history has a branch of its own, so the commits this job
      # makes never get in the way of work on main.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/requirements.txt

      - name: Install the leaflet readers
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r tool/requirements.txt

      # Page images and OCR results from earlier runs, so only new leaflets
      # are read. A new cache is saved after every run.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-

      - run: flutter pub get

      # --strict: if any shop's page cannot be read, fail and leave
      # yesterday's complete feed online rather than publish one with a
      # shop missing.
      - name: Build the feed
        run: dart run tool/update_feed.dart --strict

      # Shops take old leaflets down, so history.json is the only record
      # of past prices. last-scrape.json lets a later run cover for a shop
      # whose site refuses it.
      - name: Save the price history
        working-directory: data
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json last-scrape.json
            git commit -m "Prices read on $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets/data

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
